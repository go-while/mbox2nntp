name: release

# Builds mbox2nntp, uatexport, ncexport and iafetch for Linux, Windows, macOS and FreeBSD and
# publishes them as a GitHub release. Two ways to start it:
#   - push a tag:  git tag v0.1.0 && git push origin v0.1.0
#   - Actions tab > release > Run workflow, with the version to tag; the
#     release then tags the commit the workflow ran on.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to release, such as v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: 7-Zip and zstd, for the tests
        run: |
          command -v 7z || { sudo apt-get update && sudo apt-get install -y 7zip; }
          command -v zstd || { sudo apt-get update && sudo apt-get install -y zstd; }
      - name: Test
        run: |
          go vet ./...
          go test ./...
          go -C cmd/iafetch vet ./...
          go -C cmd/iafetch test ./...
      - name: Build
        run: .github/release-build.sh "$TAG"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Each archive holds `mbox2nntp`, `uatexport`, `ncexport` and `iafetch` for one system, with README and LICENSE; unpack and run, nothing to install. Check downloads against the `_checksums.txt` file (`sha256sum -c`).

          `.gz`, `.zip`, mbox and directory inputs, ncexport and iafetch need no other program. `.7z` inputs need 7-Zip, UAT archives (`.usenet`) need zstd, and `.usenet.xz` needs xz or 7-Zip: see the README.
          EOF
          gh release create "$TAG" dist/* --title "$TAG" --target "$GITHUB_SHA" --notes-file notes.md --generate-notes
