name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: 7-Zip and zstd, for the 7z and UAT tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ] && ! command -v 7z && ! command -v 7zz; then brew install sevenzip; fi
          if [ "$RUNNER_OS" = macOS ] && ! command -v zstd; then brew install zstd; fi
          if [ "$RUNNER_OS" = Linux ] && ! command -v 7z; then sudo apt-get update && sudo apt-get install -y 7zip; fi
          if [ "$RUNNER_OS" = Linux ] && ! command -v zstd; then sudo apt-get update && sudo apt-get install -y zstd; fi
          if [ "$RUNNER_OS" = Windows ] && ! command -v zstd; then choco install -y zstandard; fi
      - run: go vet ./...
      - run: go test -race ./...
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
